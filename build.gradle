plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}" apply false
	id 'maven-publish'
}

/**
 * Client sources that are duplicated verbatim across every versions/* subproject.
 *
 * They cannot move to common/: that module declares no Minecraft artifact at all and compiles
 * standalone, so anything importing net.minecraft.* fails there (see CLAUDE.md). The duplication
 * is deliberate, but until now "edit one, diff, copy to the other" was only documented - nothing
 * caught a copy that drifted. This does, on every build.
 *
 * The check below reads the version list off the included subprojects rather than naming them, so
 * adding versions/26.4 to settings.gradle brings it under the same guarantee with no edit here.
 * Every listed file must be byte-identical in ALL of them, not merely in some pair.
 */
def sharedClientSources = [
	'Waypoint.java',
	'ModConfig.java',
	'I18nHelper.java',
	'ModernButton.java',
	'WaypointDisplayMode.java',
	'WaypointSortMode.java',
	'WaypointPing.java',
	'ModMenuIntegration.java',
	'UiPalette.java',
	'Icons.java',
	'DeathWaypointManager.java',
	'ModConfigScreen.java',
	'ModKeyBindings.java',
	'WaypointListScreen.java',
	'DimensionNames.java',
	'XaeroBridge.java',
	'XaeroMinimapBridge.java',
	'XaeroSync.java',
	'XaeroLinkLedger.java',
	'WaypointColors.java',
	'ImportWorldScreen.java',
	'WaypointShare.java',
	'EasyWpCommands.java',
	'ChatAddButtons.java',
	'PlayerPickScreen.java',
	'EasyWpClient.java',
	'WaypointRenderer.java',
	'WaypointStore.java',
	'WaypointCreateScreen.java',
	'ImportConfirmScreen.java'
]

/**
 * Files that are byte-identical today but deliberately NOT guarded as shared.
 *
 * The check below fails on any file that is identical in every version and missing from
 * sharedClientSources, because identical-but-unlisted is exactly the state in which a later drift
 * ships unnoticed - which is what happened to ModMenuIntegration.java. This is the escape hatch for
 * a file that matches everywhere by coincidence and is expected to diverge; it is empty on purpose.
 *
 * A file identical in only SOME versions is not flagged and does not belong here: that is a
 * deliberate per-version split, not an unguarded share.
 */
def intentionallyUnsharedSources = []

tasks.register('checkSharedSources') {
	group = 'verification'
	description = 'Fails if the client sources duplicated across every versions/* subproject have drifted apart.'

	// Derived from the included subprojects, not hardcoded: a version added to settings.gradle is
	// checked from its first build, and one removed stops being looked for.
	def clientDirs = subprojects
			.findAll { it.projectDir.parentFile == file('versions') }
			.sort { it.name }
			.collect { [name: it.name, dir: new File(it.projectDir, 'src/client/java/com/easywp/client')] }
	def names = sharedClientSources
	def exempt = intentionallyUnsharedSources

	// Every client source in every tree is an input, not just the listed ones: the unlisted-file
	// detection below has to re-run when any of them changes.
	inputs.files(clientDirs.collect { fileTree(it.dir) { include '*.java' } })
			.withPropertyName('clientSources')
	// Nothing is produced, so declare the marker explicitly to stay cacheable and up-to-date aware.
	def marker = layout.buildDirectory.file('checkSharedSources.txt')
	outputs.file(marker)

	doLast {
		if (clientDirs.size() < 2) {
			marker.get().asFile.text = "ok\n"
			return
		}

		def problems = []
		names.each { name ->
			// Group the versions by content, so a three-way split reports which copies agree with
			// which instead of just naming one of them as the odd one out.
			def missing = clientDirs.findAll { !new File(it.dir, name).isFile() }.collect { it.name }
			if (!missing.isEmpty()) {
				problems << "${name}: missing in ${missing.join(', ')}"
				return
			}
			def byContent = clientDirs.groupBy { new File(it.dir, name).bytes.encodeHex().toString() }
			if (byContent.size() > 1) {
				def groups = byContent.values().collect { it.collect { v -> v.name }.join('+') }.sort()
				problems << "${name}: the copies have drifted apart (${groups.join(' vs ')})"
			}
		}

		if (!problems.isEmpty()) {
			throw new GradleException(
					"Shared client sources are out of sync:\n  " + problems.join('\n  ') +
					"\n\nEdit one copy, check it with diff, and copy it over the others (see CLAUDE.md).\n" +
					"If diff reports every line as different, the file's line endings are wrong: .gitattributes\n" +
					"pins the whole tree to LF."
			)
		}

		// A file that is identical in every tree but absent from the list is unguarded: nothing would
		// notice the day the copies stop matching. Flag it so it gets listed now, while they still
		// agree, rather than after a silent divergence has already shipped. A file identical in only
		// some of the trees is a deliberate split (see intentionallyUnsharedSources) and is left alone.
		def reference = clientDirs.first()
		def others = clientDirs.tail()
		def unguarded = []
		reference.dir.listFiles({ f -> f.isFile() && f.name.endsWith('.java') } as FileFilter).each { a ->
			def name = a.name
			if (names.contains(name) || exempt.contains(name)) return
			if (others.every { def b = new File(it.dir, name); b.isFile() && java.util.Arrays.equals(a.bytes, b.bytes) }) {
				unguarded << name
			}
		}

		if (!unguarded.isEmpty()) {
			throw new GradleException(
					"These client sources are byte-identical across every version but are not guarded:\n  " +
					unguarded.sort().join('\n  ') +
					"\n\nAdd each to sharedClientSources in build.gradle so a future drift fails the build.\n" +
					"If a file matches everywhere only by coincidence and is expected to diverge, add it to\n" +
					"intentionallyUnsharedSources instead."
			)
		}

		marker.get().asFile.text = "ok\n"
	}
}

/**
 * Minecraft versions that ship as ONE jar. The first one's jar is the one published (built against
 * the oldest Minecraft, so it cannot use anything only the newer one has); every other one keeps
 * its subproject only to compile the very same sources against its own Minecraft and run them with
 * runClient, and marks itself verification_only so its jar stays out of build/libs.
 *
 * Two checks make that safe. checkMergedSources: every client source and fabric.mod.json is
 * byte-identical across the group - ClientCompat included, which resolves the renames between
 * these versions at runtime instead of per tree (see CLAUDE.md). checkMergedJar: the classes and
 * resources of their jars are byte-identical too. Compiling the same source against two
 * Minecrafts giving the same bytecode means every method, field and type it names exists with the
 * same signature in both - so what is tested on the newer one with runClient is exactly what
 * ships for it.
 */
def mergedVersions = ['26.1', '26.2']

def mergedProjects = {
	mergedVersions.collect { v -> project(":versions:${v}") }
}

tasks.register('checkMergedSources') {
	group = 'verification'
	description = 'Fails if the versions that ship as one jar no longer have identical client sources and fabric.mod.json.'

	def trees = mergedVersions.collect { v -> [name: v, dir: file("versions/${v}")] }
	inputs.files(trees.collect { t -> fileTree(t.dir) { include 'src/client/java/**/*.java', 'src/main/resources/fabric.mod.json' } })
			.withPropertyName('mergedSources')
	def marker = layout.buildDirectory.file('checkMergedSources.txt')
	outputs.file(marker)

	doLast {
		def relative = { File root, File f -> root.toPath().relativize(f.toPath()).toString().replace('\\', '/') }
		def listing = { File root ->
			def files = [:]
			def clientRoot = new File(root, 'src/client/java')
			if (clientRoot.isDirectory()) {
				clientRoot.eachFileRecurse(groovy.io.FileType.FILES) { f ->
					if (f.name.endsWith('.java')) files[relative(root, f)] = f
				}
			}
			def fmj = new File(root, 'src/main/resources/fabric.mod.json')
			if (fmj.isFile()) files[relative(root, fmj)] = fmj
			files
		}
		def reference = trees.first()
		def referenceFiles = listing(reference.dir)
		def problems = []
		trees.tail().each { t ->
			def files = listing(t.dir)
			(referenceFiles.keySet() + files.keySet()).sort().each { name ->
				def a = referenceFiles[name]
				def b = files[name]
				if (a == null || b == null) {
					problems << "${name}: only in ${a == null ? t.name : reference.name}"
				} else if (!java.util.Arrays.equals(a.bytes, b.bytes)) {
					problems << "${name}: differs between ${reference.name} and ${t.name}"
				}
			}
		}
		if (!problems.isEmpty()) {
			throw new GradleException(
					"${mergedVersions.join('+')} ship as one jar, but their sources have drifted apart:\n  " +
					problems.join('\n  ') +
					"\n\nEvery client source - ClientCompat too - and fabric.mod.json must be identical across them.\n" +
					"A rename between these versions goes into ClientCompat as a runtime lookup (see CLAUDE.md),\n" +
					"never into a per-version copy."
			)
		}
		marker.get().asFile.text = "ok\n"
	}
}

tasks.register('checkMergedJar') {
	group = 'verification'
	description = 'Fails if the jars of the versions that ship as one jar do not hold identical classes and resources.'

	// The archive task of each subproject, looked up lazily: the root is configured first.
	def archiveTask = { Project p -> p.tasks.findByName('remapJar') ?: p.tasks.getByName('jar') }
	dependsOn { mergedProjects().collect { archiveTask(it) } }
	def marker = layout.buildDirectory.file('checkMergedJar.txt')
	outputs.file(marker)
	outputs.upToDateWhen { false }

	doLast {
		// The manifest records which Minecraft each jar was built against; everything else must match.
		def entries = { File jar ->
			def map = [:]
			new java.util.zip.ZipFile(jar).withCloseable { zip ->
				zip.entries().each { e ->
					if (!e.isDirectory() && e.name != 'META-INF/MANIFEST.MF') {
						map[e.name] = zip.getInputStream(e).bytes
					}
				}
			}
			map
		}
		def jars = mergedProjects().collect { p -> [name: p.name, file: archiveTask(p).archiveFile.get().asFile] }
		def reference = jars.first()
		def referenceEntries = entries(reference.file)
		def problems = []
		jars.tail().each { j ->
			def other = entries(j.file)
			(referenceEntries.keySet() + other.keySet()).sort().each { name ->
				def a = referenceEntries[name]
				def b = other[name]
				if (a == null || b == null) {
					problems << "${name}: only in the ${a == null ? j.name : reference.name} jar"
				} else if (!java.util.Arrays.equals(a, b)) {
					problems << "${name}: differs between the ${reference.name} and ${j.name} builds"
				}
			}
		}
		if (!problems.isEmpty()) {
			throw new GradleException(
					"The ${reference.name} jar is published for ${mergedVersions.join(' and ')}, but building the same\n" +
					"sources against another of them does not give the same jar:\n  " + problems.join('\n  ') +
					"\n\nA class that compiles to different bytecode names something that differs between those\n" +
					"Minecraft versions, and the published jar would fail on the newer one. Route it through\n" +
					"ClientCompat's runtime lookups (see CLAUDE.md)."
			)
		}
		marker.get().asFile.text = "ok\n"
	}
}

/**
 * Locales that must stay a verbatim copy of es_es.json.
 *
 * Minecraft resolves regional codes by exact match with no es_mx -> es -> en_us cascade, so every
 * Spanish code Mojang ships needs its own file or those players silently fall back to English
 * (see CLAUDE.md, i18n). They are maintained as copies, and nothing checked that until now.
 * Remove one from this list the day it earns genuinely regional wording.
 */
def spanishCopiesOfEsEs = ['es_ar', 'es_cl', 'es_ec', 'es_mx', 'es_uy', 'es_ve']

tasks.register('checkLangParity') {
	group = 'verification'
	description = 'Fails if a lang file is missing keys present in en_us.json, or if an es_* copy has drifted from es_es.json.'

	def langDir = file('common/src/main/resources/assets/easywp/lang')
	def copies = spanishCopiesOfEsEs

	inputs.files(fileTree(langDir) { include '*.json' }).withPropertyName('langFiles')
	def marker = layout.buildDirectory.file('checkLangParity.txt')
	outputs.file(marker)

	doLast {
		def slurper = new groovy.json.JsonSlurper()
		def reference = new File(langDir, 'en_us.json')
		if (!reference.isFile()) {
			throw new GradleException("Missing the reference language file: ${reference}")
		}
		def referenceKeys = slurper.parse(reference, 'UTF-8').keySet()

		def problems = []
		langDir.listFiles({ f -> f.isFile() && f.name.endsWith('.json') } as FileFilter).sort { it.name }.each { f ->
			if (f.name == 'en_us.json') return
			def keys
			try {
				keys = slurper.parse(f, 'UTF-8').keySet()
			} catch (Exception e) {
				problems << "${f.name}: is not valid JSON (${e.message})"
				return
			}
			def missing = (referenceKeys - keys).sort()
			// An extra key is never harmless - it is a key nothing ever looks up, i.e. a typo that
			// leaves the real string untranslated while looking translated in the file.
			def extra = (keys - referenceKeys).sort()
			if (!missing.isEmpty()) {
				problems << "${f.name}: missing ${missing.size()} key(s) present in en_us.json: ${missing.join(', ')}"
			}
			if (!extra.isEmpty()) {
				problems << "${f.name}: has ${extra.size()} key(s) en_us.json does not: ${extra.join(', ')}"
			}
		}

		def esEs = new File(langDir, 'es_es.json')
		if (!esEs.isFile()) {
			problems << "es_es.json: missing, but other Spanish locales are declared as copies of it"
		} else {
			copies.each { code ->
				def copy = new File(langDir, "${code}.json")
				if (!copy.isFile()) {
					problems << "${code}.json: missing - Minecraft has no es_* fallback chain, so those players get English"
				} else if (!java.util.Arrays.equals(esEs.bytes, copy.bytes)) {
					problems << "${code}.json: has drifted from es_es.json"
				}
			}
		}

		if (!problems.isEmpty()) {
			throw new GradleException(
					"Language files are inconsistent:\n  " + problems.join('\n  ') +
					"\n\nen_us.json is the reference: every other file must carry exactly its key set.\n" +
					"The es_* files are verbatim copies of es_es.json (see CLAUDE.md, i18n); edit es_es.json\n" +
					"and copy it over them, or drop a locale from spanishCopiesOfEsEs in build.gradle if it is\n" +
					"meant to differ."
			)
		}
		marker.get().asFile.text = "ok\n"
	}
}

subprojects {
	plugins.withId('java') {
		tasks.named('check').configure {
			dependsOn rootProject.tasks.named('checkSharedSources')
			dependsOn rootProject.tasks.named('checkLangParity')
			dependsOn rootProject.tasks.named('checkMergedSources')
			dependsOn rootProject.tasks.named('checkMergedJar')
		}
	}
}
