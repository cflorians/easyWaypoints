plugins {
	id 'net.fabricmc.fabric-loom'
}

version = "${project.mod_version}+${project.minecraft_version_suffix}"
group = project.maven_group
base.archivesName = "easywp"

repositories {
	maven {
		name = "Terraformers"
		url = "https://maven.terraformersmc.com/releases"
	}
	maven {
		name = "Xaero"
		url = "https://chocolateminecraft.com/maven"
	}
}

loom {
	splitEnvironmentSourceSets()

	mods {
		"easywp" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}
}

sourceSets {
	main {
		java.srcDirs += project(":common").file("src/main/java")
		resources.srcDirs += project(":common").file("src/main/resources")
	}
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
	implementation project(":common")

	// Compile-only: only the entrypoint class needs the API, and Fabric instantiates it
	// solely when Mod Menu is installed. Never bundled.
	clientCompileOnly "com.terraformersmc:modmenu:${project.modmenu_version}"

	// Compile-only: XaeroBridge gates every call on FabricLoader.isModLoaded("xaerominimap"), so
	// none of this is ever bundled or even loaded if the player doesn't have Xaero's Minimap.
	// xaerolib is Xaero's own shared-code dependency; pinned explicitly instead of letting the
	// POM's [1.7.0, 1.8) range resolve dynamically, for a reproducible build.
	clientCompileOnly "xaero.minimap:xaerominimap-fabric-${project.minecraft_version}:${project.xaero_minimap_version}"
	clientCompileOnly "xaero.lib:xaerolib-fabric-${project.minecraft_version}:${project.xaerolib_version}"
}

processResources {
	def version = project.mod_version
	def minecraftRange = project.minecraft_version_range
	inputs.property "version", version
	inputs.property "minecraftRange", minecraftRange

	filesMatching("fabric.mod.json") {
		expand "version": version, "minecraft_range": minecraftRange
	}
}

// A subproject that only verifies another one's jar (verification_only in its gradle.properties)
// keeps its jars out of build/libs, so only publishable jars land there - see checkMergedJar.
if (project.findProperty('verification_only') == 'true') {
	tasks.withType(AbstractArchiveTask).configureEach {
		destinationDirectory = layout.buildDirectory.dir('verify-libs')
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
}

java {
	withSourcesJar()
	toolchain {
		languageVersion = JavaLanguageVersion.of(25)
	}
	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}
