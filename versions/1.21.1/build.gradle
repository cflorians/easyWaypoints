plugins {
	id 'net.fabricmc.fabric-loom'
}

version = "${project.mod_version}+${project.minecraft_version_suffix}"
group = project.maven_group
base.archivesName = "easywp"

loom {
	splitEnvironmentSourceSets()

	mods {
		"easywp" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}
}

sourceSets {
	main {
		java.srcDirs += project(":common").file("src/main/java")
		resources.srcDirs += project(":common").file("src/main/resources")
	}
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"
	implementation "net.fabricmc.fabric-api:fabric-key-mapping-api-v1:2.0.4+e2bdee784c"
	implementation "net.fabricmc.fabric-api:fabric-api-base:2.0.3+ece063234c"
	implementation "net.fabricmc.fabric-api:fabric-lifecycle-events-v1:4.1.0+6d50a0854c"
	implementation "net.fabricmc.fabric-api:fabric-rendering-v1:23.1.1+1403e82c4c"
	implementation project(":common")
}

processResources {
	def version = project.mod_version
	inputs.property "version", version

	filesMatching("fabric.mod.json") {
		expand "version": version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 21
}

java {
	withSourcesJar()
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}
	sourceCompatibility = JavaVersion.VERSION_21
	targetCompatibility = JavaVersion.VERSION_21
}
